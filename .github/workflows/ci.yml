name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # topo-core / topo-lang-cpp / topo-lang-rust unpinned at promotion
  # (2026-08-16): BuildConfig::cppFlags, the mixed checker fixtures, and
  # the ungated plugin aggregators are all on main now.
  TOPO_CORE_REF: main
  TOPO_LANG_REF: main
  TOPO_V8_REF: main
  # topo-llvm unpinned at promotion (2026-08-16): the rust-v0 symbol-map +
  # verifier fixes are on topo-llvm main now.
  TOPO_LLVM_REF: main
  TOPO_JVM_REF: main
  TOPO_LANG_CPP_REF: main
  TOPO_LANG_RUST_REF: main
  TOPO_LANG_JAVA_REF: main
  TOPO_LANG_PYTHON_REF: main
  TOPO_LANG_TYPESCRIPT_REF: main
  # The cpp / rust plugin aggregators ship in every upstream install scope
  # (their closure is zero-LLVM), so build-and-smoke installs both at
  # default scope and all five plugins resolve on all three platforms.
  # integrated-check additionally builds the genuinely LLVM-gated pieces
  # (CppDriver / RustDriver and the topo-llvm backend tools) that the
  # init → build smoke dispatches to.

jobs:
  build-and-smoke:
    # topo-cli is a thin per-language router with no in-tree unit tests by
    # design. This job is build + smoke (CLI install + launch + downstream
    # find_package + init→check scaffold smoke) on all three platforms,
    # with the full default-scope plugin set — all five language plugins,
    # now that the cpp/rust aggregators ship at default scope upstream.
    # Behavioral verification lives in the integrated-check job below: it
    # adds the LLVM/JVM backend tools and runs the integrated checker
    # suite (topo-core/test/check) plus the full init→check→build smoke
    # against this repo's TopoCheckRunner — currently the only public CI
    # surface that executes topo-check behavior end-to-end. The
    # per-language checker-e2e suites in the topo-lang-* packages have no
    # public CI surface yet; extending integrated-check to drive them
    # against the same prefix is the intended follow-up.
    name: build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build openjdk-17-jdk python3 python3-pip nodejs npm

      - name: Install build deps (macos)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openjdk@17 python@3.12 node || true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Cache upstream topo install
        id: topo-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # v4: topo-core gained the BYO LLVM toolchain resolver
          # (ensureLLVMLoaderPathForChildren, called by tools/topo-build/main.cpp);
          # the upstream cache is keyed on the literal upstream refs, so bump to
          # force a fresh topo-core rebuild that carries the new API.
          # v5: topo-core IncrementalCache::saveManifest now returns bool (was
          # void); tools/topo-build/main.cpp consumes the bool result, so the
          # stale -v4 upstream install no longer compiles — bump to refetch.
          # v6: topo-core gained the tpm AdapterSource API (TpmAdapterManifestRef
          # + assembleAdapterRegistry's new tpmManifests param + TranspileRequest
          # .tpmAdapterManifests), consumed by tools/topo-transpile/main.cpp's
          # --tpm-adapters; the stale -v5 install lacks the new header API.
          # v7: topo-core BuildConfig gained consumesDeclarationsForOptimization()
          # (auto-check-when-optimizing), consumed by tools/topo-build/main.cpp's
          # check=off warning; the stale -v6 install lacks the new method.
          # v9: the prefix gains default-scope topo-lang-cpp / topo-lang-rust
          # (plugin aggregators ungated upstream) and topo-core BuildConfig
          # gained cppFlags, consumed by tools/topo-build/Config.cpp — the
          # stale -v8 prefix lacks both.
          # v10: the dev-pinned upstream tips advanced (fix batch merged to
          # core/cpp/rust dev); the key interpolates the refs, not their
          # content, so the pre-merge cache would keep serving fix-less
          # upstreams.
          key: topo-cli-deps-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-v8-${{ env.TOPO_V8_REF }}-langcpp-${{ env.TOPO_LANG_CPP_REF }}-langrust-${{ env.TOPO_LANG_RUST_REF }}-langjava-${{ env.TOPO_LANG_JAVA_REF }}-langpy-${{ env.TOPO_LANG_PYTHON_REF }}-langts-${{ env.TOPO_LANG_TYPESCRIPT_REF }}-${{ matrix.os }}-v10

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install"
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-v8
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_V8_REF}" \
              https://github.com/topo-lang/topo-v8.git \
              "${RUNNER_TEMP}/topo-v8-src"
          cmake -S "${RUNNER_TEMP}/topo-v8-src" \
                -B "${RUNNER_TEMP}/topo-v8-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-v8-build" --target install

      # Default scope is all the cpp/rust plugins need: the aggregators'
      # closure is zero-LLVM, so no LLVM dist or extra flags here. The
      # LLVM-gated pieces (CppDriver / RustDriver, debug adapters,
      # LibTooling extractor) stay out of this job — integrated-check
      # carries them for the build half of the smoke.
      - name: Build & install topo-lang-cpp (default scope)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git \
              "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-build" --target install

      - name: Build & install topo-lang-rust (default scope)
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_RUST_REF}" \
              https://github.com/topo-lang/topo-lang-rust.git \
              "${RUNNER_TEMP}/topo-lang-rust-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-rust-src" \
                -B "${RUNNER_TEMP}/topo-lang-rust-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_RUST_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-rust-build" --target install

      - name: Build & install topo-lang-java
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_JAVA_REF}" \
              https://github.com/topo-lang/topo-lang-java.git \
              "${RUNNER_TEMP}/topo-lang-java-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-java-src" \
                -B "${RUNNER_TEMP}/topo-lang-java-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_JAVA_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-java-build" --target install

      - name: Build & install topo-lang-python
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_PYTHON_REF}" \
              https://github.com/topo-lang/topo-lang-python.git \
              "${RUNNER_TEMP}/topo-lang-python-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-python-src" \
                -B "${RUNNER_TEMP}/topo-lang-python-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_PYTHON_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-python-build" --target install

      - name: Build & install topo-lang-typescript
        if: steps.topo-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_TYPESCRIPT_REF}" \
              https://github.com/topo-lang/topo-lang-typescript.git \
              "${RUNNER_TEMP}/topo-lang-typescript-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-typescript-src" \
                -B "${RUNNER_TEMP}/topo-lang-typescript-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_TYPESCRIPT_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-typescript-build" --target install

      - name: Configure topo-cli
        run: |
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build

      # topo-cli auto-detects plugin availability and silently flips a
      # missing one OFF. With the cpp/rust aggregators in the default
      # install set, all five must resolve here too — a 3/5 result means
      # the upstream prefix regressed (or the cache key went stale).
      - name: Assert all five plugins resolved
        run: |
          n=$(grep -cE '^TOPO_CLI_ENABLE_(CPP|RUST|JAVA|PYTHON|TYPESCRIPT)_PLUGIN:BOOL=ON$' build/CMakeCache.txt || true)
          echo "plugin aggregators resolved ON: ${n}/5"
          if [ "${n}" -ne 5 ]; then
            grep -E '^TOPO_CLI_ENABLE_[A-Z]+_PLUGIN:BOOL=' build/CMakeCache.txt || true
            echo "::error::expected all five language plugins to resolve in the default scope"
            exit 1
          fi

      - name: Install topo-cli
        run: cmake --install build --prefix "${RUNNER_TEMP}/cli-install"

      - name: Smoke — verify each CLI installed + launches
        run: |
          set -euo pipefail
          fail=0
          for tool in topo-check topo-build topo-init topo-transpile topo-profile; do
              bin="${RUNNER_TEMP}/cli-install/bin/${tool}"
              # Windows installs ${tool}.exe; resolve it so the check is real
              # on all three platforms (the old no-.exe path silently no-op'd
              # the Windows smoke).
              [ -x "$bin" ] || bin="${bin}.exe"
              if [ ! -x "$bin" ]; then
                  echo "MISSING: ${tool} not installed under ${RUNNER_TEMP}/cli-install/bin"
                  fail=1
                  continue
              fi
              echo "--- ${tool} ---"
              # --help is informational only: topo-build and topo-profile
              # intentionally exit non-zero on --help, so the load-bearing
              # assertion is that the binary exists + launches, not the --help
              # exit code.
              "$bin" --help 2>&1 | head -5 || true
          done
          if [ "$fail" -ne 0 ]; then
              echo "One or more CLI tools were not installed — failing the smoke."
              exit 1
          fi

      - name: find_package smoke
        run: |
          mkdir -p "${RUNNER_TEMP}/find-package-smoke"
          cd "${RUNNER_TEMP}/find-package-smoke"
          cat > vcpkg.json <<'JSON'
          {
            "name": "topo-cli-smoke",
            "version-string": "0.0.1",
            "builtin-baseline": "56bb2411609227288b70117ead2c47585ba07713",
            "dependencies": ["nlohmann-json", "tomlplusplus"]
          }
          JSON
          cat > CMakeLists.txt <<'CMAKE'
          cmake_minimum_required(VERSION 3.20)
          project(topo-cli-find-package-smoke LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          find_package(topo-cli CONFIG REQUIRED)
          if(NOT TARGET topo::cli::TopoCheckRunner)
              message(FATAL_ERROR "topo::cli::TopoCheckRunner target was not imported")
          endif()
          if(NOT TARGET topo::cli::topo-check)
              message(FATAL_ERROR "topo::cli::topo-check executable target was not imported")
          endif()
          add_executable(smoke smoke.cpp)
          target_link_libraries(smoke PRIVATE topo::cli::TopoCheckRunner)
          target_compile_definitions(smoke PRIVATE
              TOPO_CHECK_BIN="$<TARGET_FILE:topo::cli::topo-check>")
          # MinGW on GHA can't reliably resolve the runner's libstdc++/libgcc
          # DLLs against the cached upstream install; static-link the
          # downstream smoke so it's hermetic.
          if(MINGW)
              target_link_options(smoke PRIVATE -static -static-libgcc -static-libstdc++)
          endif()
          CMAKE
          cat > smoke.cpp <<'CPP'
          #include "CheckRunner.h"
          #include <cstdio>
          #include <filesystem>
          int main() {
              topo::CheckConfig cfg;
              cfg.projectDir = ".";
              cfg.checkName = "all";
              topo::CheckRunner runner(cfg);
              if (!std::filesystem::exists(TOPO_CHECK_BIN)) return 2;
              std::printf("topo-cli find_package OK (topo-check=%s)\n", TOPO_CHECK_BIN);
              return 0;
          }
          CPP
          cmake -S . -B build -G Ninja \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/cli-install;${RUNNER_TEMP}/topo-install" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build
          ./build/smoke

      # Scaffold smoke, check half only: init → topo-check exit 0 for the
      # languages whose generated projects need no backend toolchain to
      # verify. This is the only Windows surface for the init → check
      # contract (integrated-check excludes Windows); the build half runs
      # there with all backend tools present.
      - name: Init smoke (java / python / typescript) — init → check
        run: |
          CLI_BIN="${RUNNER_TEMP}/cli-install/bin"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            CLI_BIN="$(cygpath -u "${CLI_BIN}")"
            # Windows: the tools are MinGW-built (libstdc++-6 / libgcc_s_seh-1 /
            # libwinpthread-1). Strawberry Perl's stale runtime DLLs sit
            # earlier on PATH and shadow the build compiler's — the tools die
            # silently (loader abort, zero output). Put the exact build-time
            # gcc bin dir FIRST (same recipe as topo-core's windows test step
            # and topo-jvm's).
            cxx=$(grep -m1 '^CMAKE_CXX_COMPILER:' build/CMakeCache.txt | cut -d= -f2)
            if [ -n "$cxx" ]; then
              export PATH="$(cygpath -u "$(dirname "$cxx")"):${PATH}"
            fi
          fi
          export PATH="${CLI_BIN}:${PATH}"
          TOPO_INIT_SMOKE_CHECK_ONLY=1 sh test/smoke/run-init-smoke.sh java python typescript

  # ── Integrated checker suite (topo-core/test/check) + full init smoke ────
  # Builds topo-cli with ALL FIVE language plugins, runs the integrated
  # topo-check E2E suite (CheckRunner orchestration over real fixture
  # projects) against this repo's TopoCheckRunner, then runs the
  # init → check → build scaffold smoke for all five languages.
  # topo-core/test/check is configured standalone here — its CMakeLists
  # bootstraps from CMAKE_PREFIX_PATH when it is the top-level source dir,
  # with every package REQUIRED so a missing dependency fails the configure
  # instead of self-skipping into a vacuous green.
  #
  # The plugin aggregators ship at default scope upstream, so they need no
  # LLVM. The LLVM surface this job keeps exists for the BACKEND TOOLS the
  # smoke's build half dispatches to: topo-build-llvm-{cpp,rust} link the
  # LLVM-gated TopoCppDriver / TopoRustDriver, so the prefix carries
  # topo-lang-cpp / topo-lang-rust at LLVM scope plus topo-llvm with tools
  # ON (bootstrap order: llvm core → lang LLVM scope → llvm tools), and
  # topo-jvm contributes topo-build-jvm-java. The LLVM/Clang dev trees must
  # be present on EVERY run (the installed lang-cpp package config
  # find_dependency's LLVM + Clang at its recorded ENABLE_LLVM=ON scope);
  # the assembled topo prefix is cached, so the builds themselves are paid
  # only on cache miss.
  #
  # At runtime the suite needs no host language servers: the cpp fixtures
  # exercise the in-process L1 (regex) extraction path, and the
  # deep-degradation contract case deliberately guts PATH to prove the
  # checker refuses to degrade when the language server is absent. The only
  # expected skip is the opt-in --jobs benchmark (TOPO_BENCH_JOBS unset).
  #
  # Windows is excluded for now:
  #  (1) the check runner's language-server probes go through the reproc
  #      subprocess transport, which on Windows can hang instead of failing
  #      fast when the probed tool is absent — the suite's deep-degradation
  #      contract case depends on a fast-fail probe;
  #  (2) the LLVM scope feeding the backend tools (CppDriver / RustDriver)
  #      is itself deferred on Windows upstream (bundled-clang ABI +
  #      static-CRT pinning, see topo-lang-cpp CI). The init → check half
  #      gets its Windows coverage in build-and-smoke instead.
  #
  # LLVM here serves the backend tools (CppDriver / RustDriver) and the
  # clangd-backed L2 containment cases — NOT the plugin aggregators, which
  # build in the default (zero-LLVM) scope and are exercised by the
  # build-and-smoke five-plugin assert.
  #
  # The per-language checker-e2e suites (topo-lang-*/test) are the natural
  # next addition: configure each repo's suite against this same prefix and
  # extend the assert step's binary list.
  integrated-check:
    name: integrated check suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build openjdk-17-jdk python3 python3-pip nodejs npm

      - name: Install build deps + LLVM (macos)
        if: runner.os == 'macOS'
        run: |
          brew install ninja openjdk@17 python@3.12 node || true
          brew install llvm@22

      - name: Point find_package(LLVM/Clang) at brew llvm@22 (macos)
        if: runner.os == 'macOS'
        run: |
          BREW_LLVM="$(brew --prefix llvm@22)"
          echo "LLVM_DIR=${BREW_LLVM}/lib/cmake/llvm"   >> "$GITHUB_ENV"
          echo "Clang_DIR=${BREW_LLVM}/lib/cmake/clang" >> "$GITHUB_ENV"

      - name: Acquire bundled LLVM (linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch "${TOPO_LLVM_REF}" \
              https://github.com/topo-lang/topo-llvm.git "${RUNNER_TEMP}/topo-llvm-src"
          (cd "${RUNNER_TEMP}/topo-llvm-src" && bash scripts/setup-llvm.sh)
          LLVM_ROOT="${RUNNER_TEMP}/topo-llvm-src/llvm-dev"
          echo "LLVM_DIR=${LLVM_ROOT}/lib/cmake/llvm"   >> "$GITHUB_ENV"
          echo "Clang_DIR=${LLVM_ROOT}/lib/cmake/clang" >> "$GITHUB_ENV"

      # JDK 21 (not 17): the java init→build smoke runs topo-build-jvm-java,
      # which executes topo-transform.jar — compiled to JDK 21 class files
      # by its Gradle toolchain — so the runtime java must be >= 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Export GHA cache env (for vcpkg x-gha backend)
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "56bb2411609227288b70117ead2c47585ba07713"

      - name: Cache upstream topo install (all-plugin prefix)
        id: topo-check-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/topo-install
          # Distinct from build-and-smoke's topo-cli-deps-* cache: this
          # prefix additionally carries topo-llvm (backend tools ON) +
          # topo-lang-cpp / topo-lang-rust at LLVM scope (CppDriver /
          # RustDriver for those tools) + topo-jvm (topo-build-jvm-java).
          # Keyed on the literal upstream refs, so when an upstream API
          # change breaks the cached install (or the suite in
          # topo-core/test/check starts needing newer upstream behavior),
          # bump the -vN suffix to force a rebuild — same convention as the
          # build-and-smoke key above.
          # v3: prefix contents changed — topo-llvm backend tools +
          # topo-jvm joined for the init→build smoke, and the cached
          # pre-ungate lang-cpp/rust installs lack the default-scope
          # plugin aggregators.
          # v4: dev-pinned upstream tips advanced (see the build-and-smoke
          # key) — force the fresh clone.
          # v5: topo-lang-rust + topo-llvm dev tips advanced again (Self
          # normalization + symbol-map/verifier follow-ups), and the cached
          # LLVM-scope artifacts showed a producer/reader skew — rotate.
          key: topo-cli-check-deps-core-${{ env.TOPO_CORE_REF }}-lang-${{ env.TOPO_LANG_REF }}-v8-${{ env.TOPO_V8_REF }}-llvm-${{ env.TOPO_LLVM_REF }}-jvm-${{ env.TOPO_JVM_REF }}-langcpp-${{ env.TOPO_LANG_CPP_REF }}-langrust-${{ env.TOPO_LANG_RUST_REF }}-langjava-${{ env.TOPO_LANG_JAVA_REF }}-langpy-${{ env.TOPO_LANG_PYTHON_REF }}-langts-${{ env.TOPO_LANG_TYPESCRIPT_REF }}-${{ matrix.os }}-v5

      # liblldb in the bundled LLVM (linked by topo-lang-cpp's
      # topo-debug-cpp at LLVM scope) needs libpython3.11, absent on
      # ubuntu-noble — pull from deadsnakes. Only the cache-miss build
      # links it; nothing in the suite loads liblldb at runtime.
      - name: Install libpython3.11 for liblldb (linux)
        if: runner.os == 'Linux' && steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update -qq && sudo apt-get install -y -qq libpython3.11

      # cargo is needed on EVERY run, not just cache-miss builds: the rust
      # leg of the init→build smoke compiles its scaffolded crate at smoke
      # runtime (and the cache-miss lang-rust LLVM scope builds
      # topo-extract-rust via cargo). Runner images usually ship Rust, but
      # that is not guaranteed across image updates — bootstrap a minimal
      # toolchain when absent.
      - name: Ensure Rust toolchain (smoke runtime + extractor build)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          [ -d "${HOME}/.cargo/bin" ] && echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH" || true

      - name: Build & install topo-core (zero-LLVM, lang-less)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git \
              "${RUNNER_TEMP}/topo-core-src"
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_ENABLE_LLVM=OFF \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-lang
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_REF}" \
              https://github.com/topo-lang/topo-lang.git \
              "${RUNNER_TEMP}/topo-lang-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-src" \
                -B "${RUNNER_TEMP}/topo-lang-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-build" --target install

      - name: Re-install topo-core (with-lang)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          cmake -S "${RUNNER_TEMP}/topo-core-src" \
                -B "${RUNNER_TEMP}/topo-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-core-build" --target install

      - name: Build & install topo-v8
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_V8_REF}" \
              https://github.com/topo-lang/topo-v8.git \
              "${RUNNER_TEMP}/topo-v8-src"
          cmake -S "${RUNNER_TEMP}/topo-v8-src" \
                -B "${RUNNER_TEMP}/topo-v8-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/topo-v8-build" --target install

      # topo-llvm's C-ABI runtime libs #include topo-lang-cpp's
      # runtime/include/topo/*.h, so the default-scope (zero-LLVM) lang-cpp
      # install must land in the prefix BEFORE the topo-llvm core build —
      # mirrors topo-lang-cpp's own verify-llvm job.
      - name: Build & install topo-lang-cpp (default scope — runtime headers)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_CPP_REF}" \
              https://github.com/topo-lang/topo-lang-cpp.git \
              "${RUNNER_TEMP}/topo-lang-cpp-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-default-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-default-build" --target install

      - name: Build & install topo-llvm core (tools OFF, jit-engine ON)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          SRC="${RUNNER_TEMP}/topo-llvm-src"
          [ -d "$SRC" ] || git clone --depth 1 --branch "${TOPO_LLVM_REF}" \
              https://github.com/topo-lang/topo-llvm.git "$SRC"
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "$SRC" -B "${RUNNER_TEMP}/topo-llvm-core-build" -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LLVM_BUILD_TOOLS=OFF -DTOPO_LLVM_BUILD_TESTS=OFF \
                -DTOPO_LLVM_BUILD_JIT_ENGINE=ON -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-llvm-core-build" --target install

      # LLVM scope for the RustDriver that topo-build-llvm-rust links (the
      # plugin aggregator itself ships at default scope and needs none of
      # this). rust BEFORE the lang-cpp LLVM-scope install: topo-debug-rust
      # is deferred upstream and self-skips while
      # topo::lang-cpp::TopoDebugAdapter is not yet importable, keeping
      # this build lean.
      - name: Build & install topo-lang-rust (LLVM scope — RustDriver)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_RUST_REF}" \
              https://github.com/topo-lang/topo-lang-rust.git \
              "${RUNNER_TEMP}/topo-lang-rust-src"
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-lang-rust-src" \
                -B "${RUNNER_TEMP}/topo-lang-rust-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_RUST_ENABLE_LLVM=ON \
                -DTOPO_LANG_RUST_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-rust-build" --target install

      # LLVM scope for the CppDriver that topo-build-llvm-cpp links (the
      # plugin aggregator itself ships at default scope and needs none of
      # this).
      - name: Build & install topo-lang-cpp (LLVM scope — CppDriver)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-lang-cpp-src" \
                -B "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_CPP_ENABLE_LLVM=ON \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build "${RUNNER_TEMP}/topo-lang-cpp-llvm-build" --target install

      # Second configure of the topo-llvm build tree, now with tools ON:
      # topo-build-llvm-{cpp,rust,mixed} link the LLVM-scoped TopoCppDriver
      # / TopoRustDriver installed by the two steps above, which themselves
      # need topo-llvm core headers — the standard bootstrap order
      # (llvm core → lang LLVM scope → llvm tools). These tools are the
      # cpp/rust backends the init→build smoke dispatches to.
      - name: Build & install topo-llvm backend tools (tools ON)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-llvm-src" \
                -B "${RUNNER_TEMP}/topo-llvm-core-build" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DTOPO_LLVM_BUILD_TOOLS=ON
          cmake --build "${RUNNER_TEMP}/topo-llvm-core-build" --target install

      - name: Build & install topo-lang-java
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_JAVA_REF}" \
              https://github.com/topo-lang/topo-lang-java.git \
              "${RUNNER_TEMP}/topo-lang-java-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-java-src" \
                -B "${RUNNER_TEMP}/topo-lang-java-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_JAVA_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-java-build" --target install

      # topo-build-jvm-java backend for the java init→build smoke. Needs
      # topo-lang-java in the prefix (above). The transform jar must ride
      # along: TOPO_JVM_BUILD_TRANSFORM stays ON (the tool hard-errors
      # without topo-transform.jar), while decompile/tests are skipped.
      # The install routes the jar to share/topo-jvm/lib but the tool
      # resolves it NEXT TO ITS OWN BINARY — stage a copy into bin/ until
      # topo-jvm's installed layout matches its runtime lookup.
      - name: Build & install topo-jvm (topo-build-jvm-java + transform jar)
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_JVM_REF}" \
              https://github.com/topo-lang/topo-jvm.git \
              "${RUNNER_TEMP}/topo-jvm-src"
          cmake -S "${RUNNER_TEMP}/topo-jvm-src" \
                -B "${RUNNER_TEMP}/topo-jvm-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_JVM_BUILD_DECOMPILE=OFF \
                -DTOPO_JVM_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-jvm-build" --target install
          cp "${RUNNER_TEMP}/topo-install/share/topo-jvm/lib/topo-transform.jar" \
             "${RUNNER_TEMP}/topo-install/bin/topo-transform.jar"

      - name: Build & install topo-lang-python
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_PYTHON_REF}" \
              https://github.com/topo-lang/topo-lang-python.git \
              "${RUNNER_TEMP}/topo-lang-python-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-python-src" \
                -B "${RUNNER_TEMP}/topo-lang-python-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_PYTHON_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-python-build" --target install

      - name: Build & install topo-lang-typescript
        if: steps.topo-check-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${TOPO_LANG_TYPESCRIPT_REF}" \
              https://github.com/topo-lang/topo-lang-typescript.git \
              "${RUNNER_TEMP}/topo-lang-typescript-src"
          cmake -S "${RUNNER_TEMP}/topo-lang-typescript-src" \
                -B "${RUNNER_TEMP}/topo-lang-typescript-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" \
                -DTOPO_LANG_TYPESCRIPT_BUILD_TESTS=OFF
          cmake --build "${RUNNER_TEMP}/topo-lang-typescript-build" --target install

      - name: Configure & build topo-cli (all five plugins)
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build build

      # Early tripwire: topo-cli auto-detects plugin availability and
      # silently flips a missing one OFF — fine for build-and-smoke, fatal
      # to the premise of THIS job. Fail here with a clear message rather
      # than at suite configure time.
      - name: Assert all five plugins resolved
        run: |
          n=$(grep -cE '^TOPO_CLI_ENABLE_(CPP|RUST|JAVA|PYTHON|TYPESCRIPT)_PLUGIN:BOOL=ON$' build/CMakeCache.txt || true)
          echo "plugin aggregators resolved ON: ${n}/5"
          if [ "${n}" -ne 5 ]; then
            grep -E '^TOPO_CLI_ENABLE_[A-Z]+_PLUGIN:BOOL=' build/CMakeCache.txt || true
            echo "::error::expected all five language plugins to resolve — the integrated suite premise does not hold"
            exit 1
          fi

      - name: Install topo-cli
        run: cmake --install build --prefix "${RUNNER_TEMP}/cli-install"

      # On a cache hit the upstream clone steps were skipped; the suite
      # sources are needed regardless. Standing caveat of the literal-"main"
      # cache key: the cached prefix can lag the freshly cloned test
      # sources — if the suite starts requiring newer upstream behavior,
      # bump the cache key -vN suffix.
      - name: Fetch topo-core test sources
        run: |
          [ -d "${RUNNER_TEMP}/topo-core-src" ] || git clone --depth 1 --branch "${TOPO_CORE_REF}" \
              https://github.com/topo-lang/topo-core.git "${RUNNER_TEMP}/topo-core-src"

      - name: Configure & build the integrated checker suite (standalone topo-core/test/check)
        run: |
          LLVM_ROOT="$(dirname "$(dirname "${LLVM_DIR}")")"
          cmake -S "${RUNNER_TEMP}/topo-core-src/test/check" \
                -B "${RUNNER_TEMP}/check-suite-build" \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/cli-install;${RUNNER_TEMP}/topo-install;${LLVM_ROOT}" \
                -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          cmake --build "${RUNNER_TEMP}/check-suite-build"

      - name: Run the integrated checker suite
        run: |
          ctest --test-dir "${RUNNER_TEMP}/check-suite-build" \
                --output-on-failure --timeout 180 --no-tests=error

      - name: Assert the suite RAN — all-skip is a failure (skip != pass)
        # ctest can render a GTEST_SKIP'd case as Passed, so "ctest green"
        # could still mean "everything skipped". Re-run the suite binary and
        # assert from gtest's own summary that the always-on cases actually
        # executed (same mechanism as topo-lsp's live-bridge assertion).
        # Today's suite: 10 always-on cases (8 single-language + the 2
        # mixed-project cases) + 1 opt-in benchmark skip
        # (CheckRunner.JobsBenchmark_100Files_ParallelSpeedup, TOPO_BENCH_JOBS
        # unset). When per-language suites join this job, extend the binary
        # list below.
        run: |
          # set +e: handle errors explicitly (GHA bash runs with -e; a grep
          # no-match inside $() would otherwise abort the step silently).
          set +e
          ALLOWED_SKIP='CheckRunner.JobsBenchmark_100Files_ParallelSpeedup'
          MIN_PASSED=10

          # Self-test the parser + detector on a canned all-skip transcript
          # first, so a parsing regression cannot silently neutralize the
          # assertion below.
          selftest=$(printf '%s\n' \
            '[  PASSED  ] 0 tests.' \
            '[  SKIPPED ] 9 tests, listed below:' \
            '[  SKIPPED ] CheckRunner.AllChecksOnPassProject')
          st_passed=$(printf '%s\n' "${selftest}" | grep -oE '\[  PASSED  \] [0-9]+ test' | grep -oE '[0-9]+' | tail -1)
          st_unexpected=$(printf '%s\n' "${selftest}" | grep -E '^\[  SKIPPED \] [A-Za-z_]' | grep -v "${ALLOWED_SKIP}")
          if [ "${st_passed}" != "0" ] || [ -z "${st_unexpected}" ]; then
            echo "::error::guard self-test failed (passed='${st_passed}', detector='${st_unexpected}') — fix the parser; the assertion cannot be trusted"
            exit 1
          fi
          echo "guard self-test OK (canned all-skip transcript would be rejected)"

          fail=0
          for t in topo-check-tests; do
            exe=$(find "${RUNNER_TEMP}/check-suite-build" -type f -name "${t}" 2>/dev/null | head -1)
            if [ -z "${exe}" ]; then
              echo "::error::${t}: binary not found — the suite was gated out at configure time (vacuous green)"; fail=1; continue
            fi
            out=$("${exe}" --gtest_color=no 2>&1); rc=$?
            printf '%s\n' "${out}" | tail -8
            passed=$(printf '%s\n' "${out}" | grep -oE '\[  PASSED  \] [0-9]+ test' | grep -oE '[0-9]+' | tail -1)
            skipped=$(printf '%s\n' "${out}" | grep -oE '\[  SKIPPED \] [0-9]+ test' | grep -oE '[0-9]+' | tail -1)
            [ -z "${passed}" ] && passed=0
            [ -z "${skipped}" ] && skipped=0
            echo "${t}: ${passed} PASSED, ${skipped} SKIPPED (exit ${rc})"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::${t}: exited ${rc}"; fail=1
            fi
            if [ "${passed}" -lt "${MIN_PASSED}" ]; then
              echo "::error::${t}: expected >= ${MIN_PASSED} non-skipped cases, got ${passed} — the suite degraded to skips (skip != pass)"; fail=1
            fi
            unexpected=$(printf '%s\n' "${out}" | grep -E '^\[  SKIPPED \] [A-Za-z_]' | grep -v "${ALLOWED_SKIP}")
            if [ -n "${unexpected}" ]; then
              echo "::error::${t}: unexpected skipped cases (only the opt-in --jobs benchmark may skip):"
              printf '%s\n' "${unexpected}"; fail=1
            fi
          done
          [ "${fail}" -eq 0 ]

      # Full scaffold smoke: per language init → topo-check exit 0 →
      # topo-build exit 0. Every backend tool is in the prefix
      # (topo-build-llvm-{cpp,rust} + topo-build-jvm-java from the steps
      # above; topo-build-python / topo-build-typescript ship in the lang
      # packages' default install sets), so a missing backend here is a
      # regression, not an environment gap — REQUIRE_BUILD makes it fail.
      - name: Init smoke (5 languages) — init → check → build
        run: |
          # The smoke's backend tools spawn clang++ resolved from PATH for the
          # final link/object steps; the IR producer is the pinned LLVM 22
          # clang, and the runner's PATH clang (distro 18 / Apple 15) reads
          # that IR with an older reader — "Invalid attribute group entry
          # (Producer: LLVM22 Reader: LLVM 18/APPLE)". Put the pinned LLVM's
          # bin dir FIRST so every spawn inside the smoke sees one LLVM.
          LLVM_BIN="$(dirname "$(dirname "$(dirname "${LLVM_DIR}")")")/bin"
          if [ ! -x "${LLVM_BIN}/clang++" ]; then
            echo "::error::pinned clang++ not found at ${LLVM_BIN} — the smoke would silently pick the system clang and hit the producer/reader skew"
            exit 1
          fi
          export PATH="${RUNNER_TEMP}/cli-install/bin:${RUNNER_TEMP}/topo-install/bin:${LLVM_BIN}:${PATH}"
          TOPO_INIT_SMOKE_REQUIRE_BUILD=1 sh test/smoke/run-init-smoke.sh
